{% extends "base.html" %}
{% block title %}Login — Hello World with AI{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="auth-logo">🤖</div>
    <h1>Welcome Back!</h1>
    <p class="auth-subtitle">Log in to continue your AI learning journey.</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" class="form-control"
                   value="{{ identifier or '' }}" placeholder="yourname or you@email.com" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="••••••••" required>
        </div>
        <div class="form-group flex-between">
            <label class="flex" style="font-weight:400; cursor:pointer;">
                <input type="checkbox" name="remember" style="margin-right:6px;"> Remember me
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
